name: Remote Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          envs: GEMINI_KEY
          script: |
            cd ~/domains/atulautomation.com/nodejs || cd ~/atul-automation-new
            git pull origin main
            # Inject GEMINI_API_KEY from GitHub Secrets (if configured)
            if [ -n "$GEMINI_KEY" ]; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_KEY|g" .env.local
              echo "Gemini key injected successfully"
            fi
            npm install
            npm run build
            pm2 restart atul-automation || pm2 start ecosystem.config.js --name atul-automation
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Notify Search Engines via IndexNow
        if: success()
        run: |
          # Wait for the server to restart
          sleep 30
          # Trigger IndexNow to notify Bing/Yandex of updated pages
          curl -s -X POST https://atulautomation.com/api/indexnow \
            -H "Content-Type: application/json" \
            || echo "IndexNow notification skipped (server may still be restarting)"

      - name: Ping Google Sitemap
        if: success()
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://atulautomation.com/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://atulautomation.com/sitemap.xml" || true
